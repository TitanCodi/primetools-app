  <title>Page not found — PrimeTools.app</title>
  <meta name="robots" content="noindex" />

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563EB; --blue-light: #EFF6FF; --text: #0F172A;
      --text-muted: #475569; --border: #E2E8F0; --font: 'Plus Jakarta Sans', sans-serif;
    }
    body { font-family: var(--font); color: var(--text); line-height: 1.7; background: #fff; }
    nav { border-bottom: 1px solid var(--border); padding: 0 24px; }
    .nav-inner { max-width: 760px; margin: 0 auto; height: 60px; display: flex; align-items: center; }
    .logo { font-size: 17px; font-weight: 800; color: var(--text); text-decoration: none; }
    .logo span { color: var(--blue); }
    main { max-width: 760px; margin: 0 auto; padding: 80px 24px 100px; text-align: center; }
    h1 { font-size: 36px; font-weight: 800; letter-spacing: -0.8px; margin-bottom: 12px; }
    p { font-size: 16px; color: var(--text-muted); margin-bottom: 32px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .btn { display: inline-block; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 700; text-decoration: none; border: 2px solid var(--blue); }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-secondary { background: #fff; color: var(--blue); }
    @media (max-width: 480px) {
      main { padding: 56px 20px 72px; }
      h1 { font-size: 28px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
<nav><div class="nav-inner"><a href="/" class="logo">Prime<span>Tools</span>.app</a></div></nav>
<main>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <div class="actions">
    <a href="/" class="btn btn-primary">Go to homepage</a>
    <a href="/#tools" class="btn btn-secondary">Browse our tools</a>
  </div>
</main>
</body>
